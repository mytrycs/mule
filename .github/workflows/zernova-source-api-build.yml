name: ZERNOVA pinned API and kernel source build
on:
  push:
    branches: [zernova/runtime-recovery-20261029]
    paths:
      - .github/workflows/zernova-source-api-build.yml
      - .github/zernova-full-source-build.sh
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the isolated build recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: build-driver
          persist-credentials: false
      - name: Check out the owner's exact supplied kernel source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8d1af8a8aa9ee6f95621f617ac848c4a49a5d8a6
          path: kernel
          persist-credentials: false
      - name: Check out pinned public API source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mulesoft/mule-api
          ref: acf394e596fb41df1649ae00b2d5c7e4377078b8
          path: api
          persist-credentials: false
      - name: Check out matching extension API source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mulesoft/mule-extensions-api
          ref: be8ee76e1a359c263861baf539c5359eaa89e9f1
          path: extensions
          persist-credentials: false
      - name: Check out pinned standalone assembly source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mulesoft/mule-distributions
          ref: fa3255511c83e0a9aac5768d71ac4c51b32ffcce
          path: distributions
          persist-credentials: false
      - name: Compile pinned sources and attempt standalone assembly
        shell: bash
        env:
          MAVEN_OPTS: -Drevapi.skip=true
        run: |
          mkdir -p source-build-evidence
          printf 'Historical API comparison is NOT VERIFIED: its published baseline mule-extensions-mime-types:1.9.0-rc1 is unavailable. The documented revapi.skip property is enabled for this compilation experiment. Java compilation, packaging and license notices are unchanged; skipped checks are not passes.\n' > source-build-evidence/API_COMPATIBILITY_CHECK.txt
          bash build-driver/.github/zernova-full-source-build.sh
      - name: Preserve compilation outputs and exact failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zernova-pinned-api-kernel-build
          path: source-build-evidence/
          retention-days: 7
          if-no-files-found: error
