name: ZERNOVA pinned API and kernel source build
on:
  push:
    branches: [zernova/runtime-recovery-20261029]
    paths:
      - .github/workflows/zernova-source-api-build.yml
      - .github/zernova-source-build.sh
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the isolated build recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: build-driver
          persist-credentials: false
      - name: Check out the owner's exact supplied kernel source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8d1af8a8aa9ee6f95621f617ac848c4a49a5d8a6
          path: kernel
          persist-credentials: false
      - name: Check out the corresponding public API source line
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mulesoft/mule-api
          ref: acf394e596fb41df1649ae00b2d5c7e4377078b8
          path: api
          persist-credentials: false
      - name: Compile pinned sources and required cross-module test fixtures
        shell: bash
        run: bash build-driver/.github/zernova-source-build.sh
      - name: Preserve compilation outputs and exact failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zernova-pinned-api-kernel-build
          path: source-build-evidence/
          retention-days: 7
          if-no-files-found: error
